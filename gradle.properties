# ============================================================
#  Xspace — Gradle properties
# ============================================================

# Gradle daemon memory + encoding
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Performance (safe for our future multi-module layout)
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX (required for modern Android libraries)
android.useAndroidX=true

# Faster, cleaner R class generation
android.nonTransitiveRClass=true

# Kotlin code style
kotlin.code.style=official
